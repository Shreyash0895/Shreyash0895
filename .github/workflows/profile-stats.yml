
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:

      # Checkout profile repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # GitHub Statistics
      # --------------------------------------------------

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Shreyash0895&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Top Languages
      # --------------------------------------------------

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Shreyash0895&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # GitHub Trophies
      # --------------------------------------------------

      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=Shreyash0895&theme=tokyonight&no-frame=true&no-bg=true&column=7
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Top Contributed Repositories
      # --------------------------------------------------

      - name: Generate Contributor Stats
        uses: HwangTaehyun/github-contributor-stats/action@main
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: Shreyash0895
          output-file: profile/contributor-stats.svg
          combine-all-yearly-contributions: "true"
          hide-contributor-rank: "false"
          order-by: contributions
          limit: "5"
          theme: dark
          rate-limit-delay-ms: "100"

      # --------------------------------------------------
      # Activity Graph
      # --------------------------------------------------

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Shreyash0895
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Commit generated files
      # --------------------------------------------------

      - name: Commit generated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub profile statistics"

          git push
